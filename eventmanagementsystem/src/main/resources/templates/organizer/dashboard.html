<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Organizer Dashboard')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<section class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-kanban"></i> Organizer Dashboard</h1>
            <a th:href="@{/organizer/events/new}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Create Event</a>
        </div>
        <p class="text-muted">Welcome back, <strong th:text="${user.name}">Organizer</strong>!</p>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h6>Total Events</h6>
                        <h2 th:text="${events.size()}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h6>Total Seats</h6>
                        <h2 th:text="${events.stream().mapToInt(e -> e.getTotalSeats()).sum()}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h6>Available Seats</h6>
                        <h2 th:text="${events.stream().mapToInt(e -> e.getAvailableSeats()).sum()}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h6>Booked Seats</h6>
                        <h2 th:text="${events.stream().mapToInt(e -> e.getTotalSeats() - e.getAvailableSeats()).sum()}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5>My Events</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Title</th><th>Type</th><th>Date</th><th>Venue</th>
                                <th>Price</th><th>Seats</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="event : ${events}">
                                <td th:text="${event.title}">Title</td>
                                <td><span class="badge bg-primary" th:text="${event.eventType}">TYPE</span></td>
                                <td th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy')}">Date</td>
                                <td th:text="${event.venue}">Venue</td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(event.ticketPrice, 0, 0)}">Price</td>
                                <td th:text="${event.availableSeats + '/' + event.totalSeats}">Seats</td>
                                <td>
                                    <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-sm btn-outline-info"><i class="bi bi-eye"></i></a>
                                    <a th:href="@{/organizer/events/{id}/edit(id=${event.id})}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/organizer/events/{id}/delete(id=${event.id})}" class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('Delete this event?')"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${events.isEmpty()}" class="text-center py-4 text-muted">
                    <i class="bi bi-calendar-plus display-4"></i>
                    <h5 class="mt-2">No events yet</h5>
                    <p>Click "Create Event" to add your first event.</p>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
