<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Events')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<section class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="${categoryTitle != null ? categoryTitle : 'All Events'}">Events</h1>
            <div class="btn-group">
                <a th:href="@{/events}" class="btn btn-outline-primary btn-sm">All</a>
                <a th:href="@{/events/music}" class="btn btn-outline-primary btn-sm">Music</a>
                <a th:href="@{/events/college}" class="btn btn-outline-primary btn-sm">College</a>
                <a th:href="@{/events/sports}" class="btn btn-outline-primary btn-sm">Sports</a>
                <a th:href="@{/events/conferences}" class="btn btn-outline-primary btn-sm">Conferences</a>
                <a th:href="@{/events/workshops}" class="btn btn-outline-primary btn-sm">Workshops</a>
            </div>
        </div>

        <div th:if="${events.isEmpty()}" class="text-center py-5">
            <i class="bi bi-calendar-x display-1 text-muted"></i>
            <h4 class="mt-3 text-muted">No events found</h4>
            <p class="text-muted">Check back soon for exciting new events!</p>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="event : ${events}">
                <div class="card event-card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <span class="badge bg-primary mb-2 align-self-start" th:text="${event.eventType}">TYPE</span>
                        <h5 class="card-title" th:text="${event.title}">Event Title</h5>
                        <p class="card-text text-muted small flex-grow-1">
                            <i class="bi bi-geo-alt"></i> <span th:text="${event.venue}">Venue</span><br/>
                            <i class="bi bi-calendar"></i> <span th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy, HH:mm')}">Date</span><br/>
                            <i class="bi bi-people"></i> <span th:text="${event.availableSeats + '/' + event.totalSeats + ' seats'}">Seats</span>
                        </p>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <span class="fw-bold text-primary fs-5" th:text="'₹' + ${#numbers.formatDecimal(event.ticketPrice, 0, 0)}">Price</span>
                            <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-sm btn-primary">View Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
