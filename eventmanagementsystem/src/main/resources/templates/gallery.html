<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Gallery')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<section class="py-5">
    <div class="container">
        <h1 class="mb-4">Event Gallery</h1>
        <p class="text-muted">A glimpse of our past and upcoming events across categories.</p>
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="event : ${events}">
                <div class="card gallery-card shadow-sm h-100">
                    <div class="card-body">
                        <span class="badge bg-primary mb-2" th:text="${event.eventType}">TYPE</span>
                        <h5 th:text="${event.title}">Title</h5>
                        <p class="text-muted small mb-1"><i class="bi bi-geo-alt"></i> <span th:text="${event.venue}">Venue</span></p>
                        <p class="text-muted small mb-0"><i class="bi bi-calendar"></i>
                            <span th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy')}">Date</span>
                        </p>
                    </div>
                    <div class="card-footer bg-transparent">
                        <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-sm btn-outline-primary w-100">View Details</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${events.isEmpty()}" class="text-center py-5 text-muted">
            <i class="bi bi-images display-1"></i>
            <h4 class="mt-3">No events in gallery yet</h4>
        </div>
    </div>
</section>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
