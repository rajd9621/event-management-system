<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Login')}"></head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> Login</h3>
                    <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error[0]}">Error</div>
                    <div th:if="${param.logout}" class="alert alert-success">Logged out successfully.</div>
                    <div th:if="${param.registered}" class="alert alert-success">Registration successful! Please login.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="username" placeholder="you@example.com" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" placeholder="••••••••" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                    </form>
                    <p class="text-center text-muted small mb-0">
                        Don't have an account? <a th:href="@{/register}">Sign up</a>
                    </p>
                    <hr>
                    <div class="text-center small text-muted">
                        <strong>Demo Accounts (password: admin123):</strong><br>
                        admin@eventhub.com &middot; organizer@eventhub.com &middot; user@eventhub.com
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
